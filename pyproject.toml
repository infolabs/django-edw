[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "django-edw"
version = "0.2.0"
description = "A RESTful Django Enterprise Data Warehouse"
readme = "README.md"
authors = [
    {name = "InfoLabs LLC", email = "team@infolabs.ru"},
]
license = {file = "LICENSE.txt"}
urls = {Homepage = "https://bitbucket.org/info-labs/django-edw.git"}
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    # Матрица G0.1 (edw-inventory.json): Django 5.2 LTS, DRF 3.18,
    # django-mptt 0.20, django-polymorphic 4.11, django-select2 8.4,
    # django-filer 3.6, django-fsm-2 4.2. Верхние границы — следующая
    # мажорная/минорная линия, ещё не прошедшая проверку контрактов E1-E4.
    "Django>=4.2,<5.3",
    "djangorestframework>=3.15,<3.19",
    "django-filer>=3.1,<3.7",
    # django-fsm прекращён; django-fsm-2 сохраняет модуль django_fsm.
    "django-fsm-2>=3.0,<4.3",
    "django-rest-auth>=0.5.0",
    "django-select2>=8.1,<8.5",
    "django-mptt>=0.16,<0.21",
    "djangorestframework-recursive>=0.1.2",
    "djangorestframework-filters>=0.11.1",
    "django-polymorphic>=3.1,<4.12",
]

[tool.setuptools]
package-dir = {"" = "backend"}
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["backend"]
exclude = ["sandbox*"]

[tool.setuptools.package-data]
edw = ["templates/**/*", "static/**/*", "locale/**/*"]
email_auth = ["locale/**/*"]
