[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "django-edw"
version = "0.2.0"
description = "A RESTful Django Enterprise Data Warehouse"
readme = "README.md"
authors = [
    {name = "InfoLabs LLC", email = "team@infolabs.ru"},
]
license = {file = "LICENSE.txt"}
urls = {Homepage = "https://bitbucket.org/info-labs/django-edw.git"}
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    # Матрица G0.runtime, принятая человеком: только эти обязательные
    # распределения проверяются реальным runtime gate. Точные версии —
    # исследовательский pin пилота, не обещание поддержки более широких линий.
    "Django==5.2.18",
    "djangorestframework==3.18.3",
    "django-bitfield==2.4.0",
    # InfLabs fork 0.3.0a1 (exact commit e39983cb...), не PyPI 0.2.1.
    "djangorestframework-bulk==0.3.0a1",
    "django-filter==26.2",
    "djangorestframework-filters==1.0.0.dev2",
    "djangorestframework-recursive==0.1.2",
    # Соседние линии матрицы: верхняя граница — следующая непроверенная линия.
    "drf-nested-routers>=0.95,<0.96",
    "django-mptt>=0.20,<0.21",
    "django-polymorphic>=4.11,<4.12",
    "django-select2>=8.4,<8.5",
    "django-filer>=3.6,<3.7",
    # django-fsm прекращён; django-fsm-2 сохраняет модуль django_fsm.
    "django-fsm-2>=4.2,<4.3",
    # Прямые обязательные импорты ядра (проверяются импортом, не extras).
    "django-classy-tags>=4,<5",
    "django-ipware>=7,<9",
    "django-post_office>=3.11,<3.13",
    "easy-thumbnails>=2.9,<2.11",
    "jsonfield>=3.1,<3.3",
    "python-dateutil>=2.8,<3",
    "six>=1.16,<2",
]

[project.optional-dependencies]
# Необязательные контуры. Для пилота они не устанавливаются и не объявляются
# проверенными: см. edw-runtime-report.json.
auth = [
    # Модуль `rest_auth` даёт django-rest-auth; dj_rest_auth — другое
    # распределение и другой модуль, они не подменяют друг друга.
    "django-rest-auth>=0.5.0",
    "dj-rest-auth>=7.0,<8",
    "django-allauth>=65,<66",
    "django-constance>=4,<5",
]
admin = [
    "django-mptt-admin>=3.0,<3.2",
    "django-admin-sortable2>=2.2,<2.4",
    "django-salmonella>=1.0",
    "django-dynamic-raw-id>=5.1",
]
search = [
    "django-haystack>=3.2,<4",
    "drf-haystack>=1.8,<2",
]
task = [
    "celery>=5.2,<6",
    "pytils>=0.4,<0.5",
]
geo = [
    "django-geoposition>=1.0",
    "geopy>=2.4,<3",
    "requests>=2.31,<3",
    "simplejson>=3.19,<4",
]

[tool.setuptools]
package-dir = {"" = "backend"}
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["backend"]
exclude = ["sandbox*"]

[tool.setuptools.package-data]
edw = ["templates/**/*", "static/**/*", "locale/**/*"]
email_auth = ["locale/**/*"]
